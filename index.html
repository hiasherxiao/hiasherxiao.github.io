<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>albatross.loc.cc</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: linear-gradient(180deg, #7ec8f2 0%, #a8dcf5 42%, #d9f0fb 68%, #bfe3f2 100%);
    position: relative;
  }

  /* ---------- sun ---------- */
  .sun {
    position: absolute; top: 7%; right: 9%;
    width: 90px; height: 90px; border-radius: 50%;
    background: radial-gradient(circle, #fff8d6 0%, #ffe98a 55%, rgba(255, 233, 138, 0) 72%);
    box-shadow: 0 0 60px 24px rgba(255, 240, 170, .55);
  }

  /* ---------- clouds ---------- */
  .cloud { position: absolute; background: #fff; border-radius: 999px; opacity: .85; filter: blur(1px); }
  .cloud::before, .cloud::after {
    content: ""; position: absolute; background: #fff; border-radius: 50%;
  }
  .cloud1 { width: 130px; height: 38px; top: 14%; animation: drift 70s linear infinite; }
  .cloud1::before { width: 58px; height: 58px; top: -26px; left: 24px; }
  .cloud1::after { width: 40px; height: 40px; top: -16px; right: 22px; }
  .cloud2 { width: 90px; height: 28px; top: 30%; animation: drift 95s linear infinite; animation-delay: -40s; opacity: .7; }
  .cloud2::before { width: 44px; height: 44px; top: -20px; left: 16px; }
  .cloud2::after { width: 30px; height: 30px; top: -12px; right: 16px; }
  .cloud3 { width: 160px; height: 44px; top: 6%; animation: drift 120s linear infinite; animation-delay: -80s; opacity: .55; }
  .cloud3::before { width: 66px; height: 66px; top: -30px; left: 32px; }
  .cloud3::after { width: 46px; height: 46px; top: -18px; right: 28px; }
  @keyframes drift {
    from { left: -180px; }
    to { left: 110vw; }
  }

  /* ---------- sea ---------- */
  .sea { position: absolute; left: 0; right: 0; bottom: 0; height: 22%; overflow: hidden; }
  .wave { position: absolute; left: 0; bottom: 0; width: 200%; height: 100%; }
  .wave-back { opacity: .55; animation: sway 9s ease-in-out infinite alternate; }
  .wave-front { animation: sway 6s ease-in-out infinite alternate-reverse; }
  @keyframes sway {
    from { transform: translateX(-4%); }
    to { transform: translateX(0%); }
  }

  /* ---------- albatross ---------- */
  .bird { position: absolute; left: 0; z-index: 5; pointer-events: none; will-change: transform; }
  .bird svg { display: block; overflow: visible; }
  .bird1 { top: 20%; animation: fly1 26s linear infinite; }
  .bird2 { top: 40%; animation: fly2 36s linear infinite; animation-delay: -14s; opacity: .9; }
  .bird3 { top: 9%; animation: fly3 44s linear infinite; animation-delay: -28s; opacity: .75; }
  @keyframes fly1 {
    0%   { transform: translate(-18vw, 0) scale(1); }
    25%  { transform: translate(20vw, -3.5vh) scale(1); }
    50%  { transform: translate(50vw, 1.5vh) scale(1); }
    75%  { transform: translate(80vw, -3vh) scale(1); }
    100% { transform: translate(115vw, 0) scale(1); }
  }
  @keyframes fly2 {
    0%   { transform: translate(-18vw, 0) scale(.62); }
    30%  { transform: translate(25vw, 2.5vh) scale(.62); }
    60%  { transform: translate(60vw, -2vh) scale(.62); }
    100% { transform: translate(115vw, 1vh) scale(.62); }
  }
  @keyframes fly3 {
    0%   { transform: translate(-18vw, 0) scale(.45); }
    35%  { transform: translate(30vw, -2vh) scale(.45); }
    70%  { transform: translate(70vw, 2vh) scale(.45); }
    100% { transform: translate(115vw, 0) scale(.45); }
  }
  /* wing flap: rotate around the shoulder joint */
  .wing-near, .wing-far { transform-box: view-box; transform-origin: 102px 46px; }
  .wing-near { animation: flap .85s ease-in-out infinite alternate; }
  .wing-far  { animation: flap-far .85s ease-in-out infinite alternate; animation-delay: -.12s; }
  @keyframes flap {
    from { transform: rotate(30deg); }
    to   { transform: rotate(-26deg); }
  }
  @keyframes flap-far {
    from { transform: rotate(18deg); }
    to   { transform: rotate(-14deg); }
  }
  .bird svg { animation: bob 2.6s ease-in-out infinite alternate; }
  @keyframes bob {
    from { transform: translateY(-4px) rotate(-1.5deg); }
    to   { transform: translateY(5px) rotate(1.5deg); }
  }

  /* ---------- text ---------- */
  .hero {
    position: absolute; left: 0; right: 0; top: 34%;
    text-align: center; z-index: 4; color: #12324a;
    text-shadow: 0 2px 18px rgba(255, 255, 255, .65);
  }
  .hero h1 { font-size: clamp(2.4rem, 7vw, 4.4rem); font-weight: 700; letter-spacing: .01em; }
  .hero p { margin-top: .7rem; font-size: clamp(1rem, 2.6vw, 1.35rem); color: #2c5878; }
  .hero .sub { margin-top: 1.6rem; font-size: .92rem; color: #4a738f; letter-spacing: .14em; }

  @media (prefers-reduced-motion: reduce) {
    .bird, .bird svg, .wing-near, .wing-far, .cloud, .wave { animation: none !important; }
    .bird1 { transform: translate(38vw, 0); }
    .bird2, .bird3 { display: none; }
  }
</style>
</head>

  <div class="sun"></div>

  <div class="cloud cloud2"></div>
  <div class="cloud cloud3"></div>

  <div class="hero">
